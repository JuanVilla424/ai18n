[tool.poetry]
name = "ai18n"
version = "1.0.3"
description = "ai18n: i18n for AI agents. One data-only file tells any AI which language to use for replies, voice, docs, code and instructions."
authors = ["B <g46327wsj1.marbling129@passinbox.com>"]
license = "Apache-2.0"
readme = "README.md"
package-mode = false

# Exact pins, mirrored in requirements.txt and requirements.dev.txt for pip setups; a test keeps
# both in step, and poetry.lock pins the transitive dependencies.
[tool.poetry.dependencies]
python = "^3.12"
pyyaml = "6.0.3"
jsonschema = "4.26.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "4.7.0"
pylint = "4.1.3"
yamllint = "1.38.0"
isort = "9.0.2"
toml = "0.10.2"
black = "26.10.1"
pytest = "9.1.1"
pytest-cov = "7.1.0"
coverage = "7.16.2"
bump2version = "1.0.1"
mypy = "2.4.0"
types-pyyaml = "6.0.12.20260906"
types-jsonschema = "4.26.0.20261006"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | scripts
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=src --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pylint]
rcfile = ".pylintrc"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
