[tool.poetry]
name = "ai18n"
version = "1.0.2"
description = "ai18n: i18n for AI agents. One data-only file tells any AI which language to use for replies, voice, docs, code and instructions."
authors = ["B <g46327wsj1.marbling129@passinbox.com>"]
license = "Apache-2.0"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
pyyaml = "^6.0"
jsonschema = "^4.23"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.0.1"
pylint = ">=3.3,<5.0"
yamllint = "^1.35.0"
isort = "^6.0.1"
toml = "^0.10.2"
black = ">=25.1,<27.0"
pytest = "^8.3.1"
pytest-cov = "^6.1.1"
coverage = "^7.2.5"
bump2version = "^1.0.0"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | scripts
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=src --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pylint]
rcfile = ".pylintrc"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
