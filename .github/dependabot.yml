# .github/dependabot.yml

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "."
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "🐛 fix(deps)"
    open-pull-requests-limit: 5
    target-branch: "dev"
  # every action is pinned to a commit SHA; Dependabot keeps those pins and their comments current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "🐛 fix(deps)"
    open-pull-requests-limit: 5
    target-branch: "dev"
