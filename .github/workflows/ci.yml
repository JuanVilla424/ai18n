---
# .github/workflows/ci.yml
#
# Coverage of main for Codecov. Formatting, lint, types, tests and the policy check run in
# python.yml on every push, main included, so this workflow does only what nothing else does.

name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install poetry==2.5.1
          poetry check --lock
          poetry install
      - name: Run tests with coverage
        run: |
          source venv/bin/activate
          pytest --cov=src --cov-report=xml:coverage.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          name: codecov-umbrella
        # an outage of the external Codecov service must not mark a correct main as failed
        continue-on-error: true
