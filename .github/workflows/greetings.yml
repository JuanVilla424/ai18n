---

name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Thanks for opening your first issue in ai18n! A maintainer will review it soon."
        pr-message: "Thanks for your first pull request to ai18n! A maintainer will review it soon."
