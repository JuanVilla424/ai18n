---
# .pre-commit-config.yaml

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # frozen: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        types: [yaml]
        files: \.(yaml)$
  - repo: local
    hooks:
      # black and pylint run from the project's environment, so the hooks
      # and the CI use the exact versions pinned in pyproject.toml
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        args: [--rcfile=.pylintrc, .]
        exclude: ^node_modules/
      - id: yaml-format
        name: yaml-format
        entry: python scripts/format_yaml/main.py
        language: system
        types: [yaml]
        files: \.(yaml)$
        exclude: '.github/.*'
      - id: yml-format
        name: yml-format
        entry: python scripts/format_yml/main.py
        language: system
        types: [yaml]
        files: \.(yml)$
        exclude: '.github/.*'
      - id: yamllint
        name: yamllint
        entry: yamllint
        language: system
        types: [yaml]
        files: \.(yml|yaml)$
        exclude: '.github/.*'
      - id: ai18n-check
        name: ai18n-check
        entry: python src/ai18n.py check --recursive
        language: system
        pass_filenames: false
        files: (^|/)(ai18n|languages)\.yaml$|^schema/|^src/ai18n\.py$
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: validate-commit
        name: validate-commit
        entry: python scripts/control_commit/main.py --log-level=DEBUG
        always_run: true
        pass_filenames: false
        language: system
        stages: [pre-push]
      - id: commit-msg-version-check
        name: commit-msg-version-check
        entry: python scripts/commit_msg_version_bump/main.py --log-level=DEBUG
        always_run: true
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: bump-year
        name: bump-year
        entry: python scripts/bump_year/main.py --log-level=INFO
        always_run: true
        pass_filenames: false
        language: system
      - id: generate-changelog
        name: generate-changelog
        entry: python scripts/generate_changelog/main.py --log-level=INFO
        always_run: true
        pass_filenames: false
        language: system
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: f12edd9c7be1c20cfa42420fd0e6df71e42b51ea  # frozen: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(markdown|md)$
